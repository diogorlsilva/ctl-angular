<ctl-section-background [backgroundUrl]="'/assets/images/refeicoes/refeicoes_background.webp'"></ctl-section-background>
<ctl-section-message-box [iconSrc]="'assets/images/refeicoes/refeicoes_logo.png'"
                         [messageBoxText]="section?.smallDescription ?? ''"
                         [title]="'Refeições'"
                         [loading]="loading">
</ctl-section-message-box>
<ctl-gallery [imagesSRCs]="section?.photoSRCs ?? []"
             [loading]="loading"></ctl-gallery>
@if (section) {
    <ctl-section-content [section]="section"></ctl-section-content>
}
