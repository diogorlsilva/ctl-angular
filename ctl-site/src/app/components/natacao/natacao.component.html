<ctl-section-background [backgroundUrl]="'assets/images/natacao/natacao_background.webp'"></ctl-section-background>
<ctl-section-message-box [iconSrc]="'assets/images/natacao/natacao_logo.webp'"
                         [loading]="loading"
                         [messageBoxText]="section?.smallDescription ?? ''"
                         [title]="'Natação'">
</ctl-section-message-box>
<ctl-gallery [images]="section?.photoSRCs ?? []"
             [loading]="loading"></ctl-gallery>
@if (section) {
    <ctl-section-content [section]="section"></ctl-section-content>
}
