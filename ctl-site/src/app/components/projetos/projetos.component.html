<ctl-section-background [backgroundUrl]="'/assets/images/projetos/projetos_background.webp'"></ctl-section-background>
<ctl-section-message-box [messageBoxText]="messageBoxText"
                         [title]="'Projetos'">
</ctl-section-message-box>

<div [attr.aria-busy]="loading"
     class="projects wrap">
    @for (project of projectItems; track $index) {
        <article class="project-card">
            <img [alt]="''"
                 [src]="project.iconSRC"
                 class="project-icon"
                 decoding="async"
                 loading="lazy">
            <h2 [innerText]="project.title"
                class="project-title"></h2>
            <p [innerText]="project.description"
               class="project-excerpt"></p>
            <button [attr.aria-label]="'Ver mais sobre ' + project.title"
                    [attr.data-bs-target]="'#' + project.modalId"
                    class="btn-pill btn-pill-white project-more"
                    data-bs-toggle="modal"
                    type="button">Ver mais
            </button>
        </article>
    } @empty {
        @if (loading) {
            @for (_ of skeletons; track $index) {
                <div aria-label="A carregar projetos"
                     class="project-card">
                    <ctl-skeleton class="project-icon" height="" radius="22%" width=""></ctl-skeleton>
                    <ctl-skeleton height="1.6em" width="70%"></ctl-skeleton>
                    <ctl-skeleton></ctl-skeleton>
                    <ctl-skeleton></ctl-skeleton>
                    <ctl-skeleton width="85%"></ctl-skeleton>
                    <ctl-skeleton class="project-more" height="44px" radius="999px" width="110px"></ctl-skeleton>
                </div>
            }
        }
    }
</div>

@for (project of projectItems; track $index) {
    <ctl-modal [contentHtml]="photos"
               [isScrollable]="false"
               [modalId]="project.modalId"
               [modalSize]="'xl'"
               [title]="project.title">
        <ng-template #photos>
            @if (project.videoURL) {
                <div class="iframe-container">
                    <iframe [src]="project.videoURL | SafeYouTubeUrl"
                            [title]="project.title"
                            allow="autoplay; encrypted-media"
                            allowfullscreen
                            class="iframe-video">
                    </iframe>
                </div>
            } @else {
                <div [id]="'carousel' + project.modalId"
                     class="carousel slide p-20" data-bs-ride="true">
                    <div class="carousel-inner">
                        @for (photoSRC of project.photoSRCs; track $index) {
                            <div [class.active]="$index === 0"
                                 class="carousel-item">
                                <img [alt]="'Imagem ' + ($index + 1) + ' do projeto ' + project.title"
                                     [src]="photoSRC"
                                     class="d-block"
                                     decoding="async"
                                     loading="lazy">
                            </div>
                        }
                    </div>
                    <button [attr.data-bs-target]="'#carousel' + project.modalId" class="carousel-control-prev"
                            data-bs-slide="prev"
                            type="button">
                        <span aria-hidden="true" class="carousel-control-prev-icon"></span>
                        <span class="visually-hidden">Anterior</span>
                    </button>
                    <button [attr.data-bs-target]="'#carousel' + project.modalId" class="carousel-control-next"
                            data-bs-slide="next"
                            type="button">
                        <span aria-hidden="true" class="carousel-control-next-icon"></span>
                        <span class="visually-hidden">Próximo</span>
                    </button>
                </div>
            }
            <div class="description-container">
                <p [innerText]="project.description"
                   class="p-20">
                </p>
            </div>
        </ng-template>
    </ctl-modal>
}
