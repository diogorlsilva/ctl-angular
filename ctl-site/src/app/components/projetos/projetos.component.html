<ctl-section-background [backgroundUrl]="'assets/images/projetos/projetos_background.webp'"></ctl-section-background>
<ctl-section-message-box [iconSrc]="'assets/images/projetos/projetos_logo.webp'"
                         [messageBoxText]="messageBoxText"
                         [title]="'Projetos'">
</ctl-section-message-box>

<div [attr.aria-busy]="loading()"
     class="projects wrap">
    @for (project of projectItems(); track project.modalId) {
        <article class="project-card">
            <img [src]="project.iconSRC"
                 alt=""
                 class="project-icon sticker"
                 decoding="async"
                 height="120"
                 loading="lazy"
                 width="120">
            <h2 [innerText]="project.title"
                class="project-title"></h2>
            <p [innerText]="project.description"
               class="project-excerpt"></p>
            <button [attr.aria-label]="'Ver mais sobre ' + project.title"
                    [attr.data-bs-target]="'#' + project.modalId"
                    class="btn-pill btn-pill-white project-more"
                    data-bs-toggle="modal"
                    type="button">Ver mais
            </button>
        </article>
    } @empty {
        @if (loading()) {
            <span class="visually-hidden">A carregar projetos</span>
            @for (_ of skeletons; track $index) {
                <div class="project-card">
                    <ctl-skeleton class="project-icon" height="" radius="22%" width=""></ctl-skeleton>
                    <ctl-skeleton height="1.6em" width="70%"></ctl-skeleton>
                    <ctl-skeleton></ctl-skeleton>
                    <ctl-skeleton></ctl-skeleton>
                    <ctl-skeleton width="85%"></ctl-skeleton>
                    <ctl-skeleton class="project-more" height="44px" radius="999px" width="110px"></ctl-skeleton>
                </div>
            }
        } @else {
            <p class="projects-empty">Ainda não há projetos publicados. Volte em breve.</p>
        }
    }
</div>

@for (project of projectItems(); track project.modalId) {
    <ctl-modal [contentHtml]="projectContent"
               [modalId]="project.modalId"
               [modalSize]="'xl'"
               [title]="project.title">
        <ng-template #projectContent>
            <ctl-dialog-media [label]="project.title"
                              [photos]="project.photoSRCs"
                              [text]="project.description"
                              [videoUrl]="project.videoURL">
            </ctl-dialog-media>
        </ng-template>
    </ctl-modal>
}
