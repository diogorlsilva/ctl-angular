@if (loading) {
    <div aria-busy="true"
         class="gallery-frame">
        <span class="visually-hidden">A carregar fotografias</span>
        <div class="gallery-track">
            @for (_ of skeletons; track $index) {
                <ctl-skeleton height="220px" width="293px"></ctl-skeleton>
            }
        </div>
    </div>
} @else if (images.length) {
    <div (contextmenu)="$event.preventDefault()"
         class="gallery-frame">
        <!-- The photos run twice so the strip can loop without a seam; the
             copy is hidden from screen readers. -->
        <div [style.--loop-duration]="images.length * secondsPerPhoto + 's'"
             [class.gallery-track--loop]="ready()"
             class="gallery-track">
            @for (src of images; track $index) {
                <img [src]="src"
                     [alt]="'Fotografia ' + ($index + 1) + ' de ' + images.length"
                     draggable="false"
                     decoding="async"
                     (load)="onSettled()"
                     (error)="onSettled()">
            }
            @for (src of images; track $index) {
                <img [src]="src"
                     alt=""
                     aria-hidden="true"
                     draggable="false"
                     decoding="async"
                     (load)="onSettled()"
                     (error)="onSettled()">
            }
        </div>
    </div>
}
