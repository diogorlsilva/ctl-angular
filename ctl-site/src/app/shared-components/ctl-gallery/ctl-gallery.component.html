@if (loading) {
    <div aria-busy="true"
         aria-label="A carregar fotografias"
         class="gallery-row">
        @for (_ of skeletons; track $index) {
            <ctl-skeleton height="220px" width="293px"></ctl-skeleton>
        }
    </div>
} @else if (images.length) {
    <div class="gallery-row">
        @for (src of images; track $index) {
            <img [src]="src"
                 alt=""
                 decoding="async"
                 loading="lazy">
        }
    </div>
}
